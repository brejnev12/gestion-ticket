name: Security Pipeline

on:
  push:
    branches:
      - secure

  pull_request:
    branches:
      - secure

jobs:
  security-checks:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gestion-ticket

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup environment
        run: |
          echo "DATABASE_URL=mysql://root:root@localhost:3306/gestion-ticket" >> .env
          echo "JWT_ACCESS_SECRET=access_secret_secure" >> .env
          echo "JWT_REFRESH_SECRET=refresh_secret_secure" >> .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migration
        run: npx prisma db push

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2

      - name: Build Next.js
        run: npm run build

  dast:
    runs-on: ubuntu-latest
    needs: security-checks
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gestion-ticket
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup environment
        run: |
          echo "DATABASE_URL=mysql://root:root@localhost:3306/gestion-ticket" >> .env
          echo "JWT_ACCESS_SECRET=access_secret_secure" >> .env
          echo "JWT_REFRESH_SECRET=refresh_secret_secure" >> .env
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Setup database
        run: npx prisma db push
      - name: Start application
        run: |
          npm run build
          npm run start &
          sleep 20
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: http://localhost:3000
